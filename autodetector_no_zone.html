<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Автодетектор</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<style>body{background:#111827;color:white;font:16px Arial;padding:16px}button,select{padding:12px;margin:5px;border:0;border-radius:8px}#view{position:relative}video{width:100%}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#status,#alarm{padding:12px;background:#374151;margin:10px 0}#alarm{display:none;background:#b91c1c}</style>
<h2>Автодетектор</h2><button id="start">Запустить камеру</button><button id="test">Тест сирены</button><label>Отсчёт <select id="delay"><option>3</option><option selected>5</option><option>10</option><option>30</option></select> сек.</label><div id="alarm">⚠ Автомобиль остановился!</div><div id="view"><video id="v" autoplay muted playsinline></video><canvas id="c"></canvas></div><div id="status">Нажми «Запустить камеру».</div><p>Поиск идёт по всему кадру. Камера требует HTTPS; модель загружается из интернета.</p>
<script>
const v=document.querySelector('#v'),c=document.querySelector('#c'),ctx=c.getContext('2d'),s=document.querySelector('#status'),alarm=document.querySelector('#alarm');let model,run=false,last=0,track=null,since=0,on=false,ac,osc,gain;
async function start(){if(!isSecureContext||!navigator.mediaDevices?.getUserMedia){s.textContent='Для камеры открой страницу по HTTPS, не как локальный файл.';return}try{s.textContent='Запрашиваю камеру…';v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});await v.play();c.width=v.videoWidth;c.height=v.videoHeight;s.textContent='Загружаю модель…';model=await cocoSsd.load();run=true;requestAnimationFrame(loop)}catch(e){s.textContent=e.name==='NotAllowedError'?'Доступ запрещён: разреши камеру сайту в настройках браузера.':e.name+': '+e.message}}
document.querySelector('#start').onclick=start;
async function loop(t){if(!run)return;if(t-last>350){last=t;try{const ps=await model.detect(v);ctx.clearRect(0,0,c.width,c.height);ps.filter(p=>['car','truck','bus'].includes(p.class)).forEach(p=>{let [x,y,w,h]=p.bbox;ctx.strokeStyle='#00ff66';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);ctx.fillStyle='#00ff66';ctx.fillText(p.class+' '+Math.round(p.score*100)+'%',x,Math.max(15,y-4))});check(ps)}catch(e){s.textContent='Ошибка модели: '+e.message}}requestAnimationFrame(loop)}
function check(ps){let cars=ps.filter(p=>['car','truck','bus'].includes(p.class)&&p.score>=.4).sort((a,b)=>b.score-a.score);if(!cars.length){track=null;since=0;stop();s.textContent='Автомобиль не обнаружен в кадре.';return}let [x,y,w,h]=cars[0].bbox,cur={x:x+w/2,y:y+h/2,w,h};if(!track){track=cur;since=Date.now();s.textContent='Автомобиль обнаружен, проверяю движение…';return}let d=Math.hypot(cur.x-track.x,cur.y-track.y),tol=Math.max(12,Math.min(track.w,track.h)*.12);if(d>tol){track=cur;since=Date.now();stop();s.textContent='Автомобиль движется. Отсчёт сброшен.';return}track={x:track.x*.65+cur.x*.35,y:track.y*.65+cur.y*.35,w,h};let sec=(Date.now()-since)/1000,n=+document.querySelector('#delay').value;s.textContent=`Автомобиль неподвижен ${sec.toFixed(1)} / ${n} сек.`;if(sec>=n&&!on)startAlarm()}
async function startAlarm(){on=true;alarm.style.display='block';try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();osc=ac.createOscillator();gain=ac.createGain();osc.type='sawtooth';osc.frequency.value=850;gain.gain.value=.22;osc.connect(gain);gain.connect(ac.destination);osc.start();let hi=true;let id=setInterval(()=>{if(!on||!gain){clearInterval(id);return}hi=!hi;gain.gain.setTargetAtTime(hi?.22:0,ac.currentTime,.03)},400);osc.onended=()=>clearInterval(id)}catch(e){s.textContent='Звук заблокирован. Нажми тест сирены.'}}
function stop(){on=false;alarm.style.display='none';if(osc){try{osc.stop()}catch{}osc=null}if(gain){gain.disconnect();gain=null}}
document.querySelector('#test').onclick=async()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=850;g.gain.value=.2;o.connect(g);g.connect(ac.destination);o.start();setTimeout(()=>o.stop(),1200)};
</script></html>
